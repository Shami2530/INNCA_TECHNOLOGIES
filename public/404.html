<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>INNCA Technologies</title>

    <script>
      const path = window.location.pathname;

      const base = "/INNCA_TECHNOLOGIES/";

      const redirect =
        base +
        "?redirect=" +
        encodeURIComponent(
          path.replace(base, "") + window.location.search
        );

      sessionStorage.setItem("redirect", redirect);

      window.location.replace(base);
    </script>
  </head>

  <body>
    Redirecting...
  </body>
</html>
